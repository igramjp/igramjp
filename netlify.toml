[build]
  publish = "public"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.html"
  [headers.values]
    Content-Type = "text/html"

[[headers]]
  for = "/app/oshiki/pkg/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/app/oshiki/pkg/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000"

# 旧アプリ名 (just-intonation-midi) からのリダイレクト
[[redirects]]
  from = "/app/just-intonation-midi/*"
  to = "/app/oshiki/"
  status = 301

[[redirects]]
  from = "/app/just-intonation-midi"
  to = "/app/oshiki/"
  status = 301

# 静的ファイルの配信を優先
[[redirects]]
  from = "/app/oshiki/pkg/*"
  to = "/app/oshiki/pkg/:splat"
  status = 200

[[redirects]]
  from = "/app/oshiki/static/*"
  to = "/app/oshiki/static/:splat"
  status = 200

# SPAルーティング
[[redirects]]
  from = "/app/oshiki/"
  to = "/app/oshiki/index.html"
  status = 200

[[redirects]]
  from = "/app/oshiki"
  to = "/app/oshiki/index.html"
  status = 200

[functions]
  directory = "netlify/functions"